<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="1С: AI инструменты">
  <title>1С: AI инструменты</title>
  <!--
    Знак приложения: жёлтая плашка — цвет 1С, в центре тёмный процессор
    с выводами по четырём сторонам, внутри процессора жёлтым «1С».
    Смысл прямой: конфигурацию 1С разбирает машина.

    Почему так, а не «1С плюс нейросеть сбоку», как было раньше: два рисунка
    рядом на 16 пикселях сливались в пятно и читались как случайные точки.
    У процессора крупный узнаваемый силуэт, который не рассыпается ни в
    favicon, ни в шапке интерфейса, а «1С» внутри работает как содержимое,
    а не как вторая половина знака.

    Всё векторное и однофайловое: иконка идёт и в браузерную вкладку,
    и в шапку интерфейса, и в репозиторий.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD34E"/>
      <stop offset="1" stop-color="#E9A521"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#plate)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#B87B12" stroke-opacity=".45" stroke-width="1.5"/>

  <!-- Выводы процессора: по три с каждой стороны -->
  <g stroke="#1B2233" stroke-width="3.4" stroke-linecap="round">
    <path d="M10 24h8M10 32h8M10 40h8"/>
    <path d="M46 24h8M46 32h8M46 40h8"/>
    <path d="M24 10v8M32 10v8M40 10v8"/>
    <path d="M24 46v8M32 46v8M40 46v8"/>
  </g>

  <!-- Корпус процессора -->
  <rect x="16" y="16" width="32" height="32" rx="8" fill="#1B2233"/>
  <rect x="18.6" y="18.6" width="26.8" height="26.8" rx="6" fill="none"
        stroke="#FFD34E" stroke-opacity=".22" stroke-width="1"/>

  <!-- «1С» внутри процессора -->
  <g fill="#FFD34E" transform="translate(11.56 8.7) scale(0.726)">
    <path d="M17.4 21.6h5.1v20.8h-4.6V26.2l-3.9 1.5-1-3.6z"/>
    <path d="M40.9 26.9a7.4 7.4 0 0 0-5-1.9c-3.9 0-6.6 2.9-6.6 7s2.7 7 6.6 7c1.9 0 3.7-.7 5-1.9l2.4 3.2a11.3 11.3 0 0 1-7.6 2.8c-6.6 0-11.2-4.7-11.2-11.1S29.1 21 35.7 21c2.9 0 5.6 1 7.6 2.8z"/>
  </g>
</svg>
